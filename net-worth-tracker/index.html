<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Privacy-First Net Worth Tracker - FIRE Toolkit</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #1c2541;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --border: #334155;
            --success: #34d399;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem 1rem; line-height: 1.5; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .nav-back { margin-bottom: 1.5rem; }
        .nav-back a { color: var(--accent); text-decoration: none; font-size: 0.95rem; font-weight: 600; }
        .nav-back a:hover { text-decoration: underline; }

        header { margin-bottom: 2rem; }
        header h1 { font-size: 2rem; color: var(--text-main); margin-bottom: 0.25rem; }
        header p { color: var(--text-muted); }
        
        .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; flex-wrap: wrap; gap: 1rem; }
        .currency-selector { padding: 0.5rem; border-radius: 8px; border: 1px solid var(--border); background-color: var(--card-bg); color: var(--text-main); font-size: 1rem; }
        
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--card-bg); padding: 1.5rem; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .stat-card h3 { font-size: 0.95rem; color: var(--text-muted); margin-bottom: 0.5rem; }
        .stat-card p { font-size: 2rem; font-weight: bold; }
        
        .color-net { color: var(--accent); }
        .color-assets { color: var(--success); }
        .color-debts { color: var(--danger); }

        .layout-grid { display: grid; grid-template-columns: 1.5fr 1fr; gap: 2rem; margin-bottom: 2rem; }
        @media (max-width: 768px) { .layout-grid { grid-template-columns: 1fr; } }
        
        .panel { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); }
        .panel h2 { font-size: 1.25rem; margin-bottom: 1rem; display: flex; justify-content: space-between; align-items: center; }
        
        .item-list { list-style: none; margin-bottom: 1rem; }
        .item-row { display: flex; gap: 0.5rem; margin-bottom: 0.5rem; align-items: center; }
        .input-text { flex-grow: 1; padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-main); height: 42px; }
        .input-num { width: 120px; padding: 0.6rem; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-main); height: 42px; }
        
        .btn { padding: 0.4rem 0.8rem; border-radius: 6px; border: none; font-weight: 600; cursor: pointer; color: white; font-size: 0.875rem; }
        .btn-add { background-color: var(--success); width: 100%; padding: 0.75rem; margin-top: 0.5rem; }
        .btn-add-debt { background-color: var(--danger); width: 100%; padding: 0.75rem; margin-top: 0.5rem; }
        
        /* BOTÓN X CORREGIDO: Cuadrado perfecto */
        .btn-delete { 
            background-color: transparent; 
            color: var(--danger); 
            border: 1px solid var(--danger); 
            width: 42px; 
            height: 42px; 
            padding: 0; 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            flex-shrink: 0; 
            transition: all 0.2s;
        }
        .btn-delete:hover { background-color: var(--danger); color: white; }

        .chart-container { position: relative; height: 300px; width: 100%; display: flex; justify-content: center; align-items: center; }
        
        footer { text-align: center; color: var(--text-muted); font-size: 0.875rem; margin-top: 4rem; }
    </style>
</head>
<body>

<div class="container">
    <div class="nav-back">
        <a href="../">← Back to FIRE Toolkit</a>
    </div>

    <header>
        <h1>Privacy-First Net Worth Tracker</h1>
        <p>Track your wealth securely. Your data never leaves your browser.</p>
    </header>

    <div class="top-bar">
        <select id="nw-currency" class="currency-selector" onchange="calculateNetWorth()">
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
            <option value="CAD">CAD (C$)</option>
            <option value="AUD">AUD (A$)</option>
        </select>
        <span style="color: var(--success); font-size: 0.875rem; font-weight: bold;">🔒 100% Local Storage</span>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Total Assets</h3>
            <p id="total-assets" class="color-assets">$0</p>
        </div>
        <div class="stat-card">
            <h3>Total Liabilities</h3>
            <p id="total-liabilities" class="color-debts">$0</p>
        </div>
        <div class="stat-card" style="border-color: var(--accent);">
            <h3>True Net Worth</h3>
            <p id="true-net-worth" class="color-net">$0</p>
        </div>
    </div>

    <div class="layout-grid">
        <div>
            <div class="panel" style="margin-bottom: 2rem;">
                <h2>📈 Assets <span id="assets-sum" class="color-assets" style="font-size: 1rem;">$0</span></h2>
                <div id="assets-list" class="item-list"></div>
                <button class="btn btn-add" onclick="addAsset()">+ Add Asset (Cash, Stocks, Crypto...)</button>
            </div>

            <div class="panel">
                <h2>📉 Liabilities <span id="liabilities-sum" class="color-debts" style="font-size: 1rem;">$0</span></h2>
                <div id="liabilities-list" class="item-list"></div>
                <button class="btn btn-add-debt" onclick="addLiability()">+ Add Liability (Mortgage, Loans...)</button>
            </div>
        </div>

        <div class="panel">
            <h2>Asset Allocation</h2>
            <div class="chart-container">
                <canvas id="allocationChart"></canvas>
            </div>
        </div>
    </div>

    <div id="global-footer-container"></div>
    <script src="../js/footer.js"></script>
</div>

<script>
    const keys = { cur: 'nw_cur', assets: 'nw_assets', liabilities: 'nw_liabilities' };
    const currencySymbols = { USD: '$', EUR: '€', GBP: '£', CAD: 'C$', AUD: 'A$' };

    let assets = JSON.parse(localStorage.getItem(keys.assets)) || [
        { name: 'Checking Account', value: 5000 },
        { name: 'Index Funds', value: 25000 }
    ];
    let liabilities = JSON.parse(localStorage.getItem(keys.liabilities)) || [
        { name: 'Car Loan', value: 8000 }
    ];
    let chartInstance = null;

    if(localStorage.getItem(keys.cur)) document.getElementById('nw-currency').value = localStorage.getItem(keys.cur);

    function addAsset() { assets.push({ name: '', value: 0 }); renderLists(); }
    function addLiability() { liabilities.push({ name: '', value: 0 }); renderLists(); }
    
    function removeAsset(index) { assets.splice(index, 1); renderLists(); }
    function removeLiability(index) { liabilities.splice(index, 1); renderLists(); }

    function updateAsset(index, field, val) {
        assets[index][field] = field === 'value' ? (parseFloat(val) || 0) : val;
        calculateNetWorth();
    }
    
    function updateLiability(index, field, val) {
        liabilities[index][field] = field === 'value' ? (parseFloat(val) || 0) : val;
        calculateNetWorth();
    }

    function renderLists() {
        const assetsContainer = document.getElementById('assets-list');
        assetsContainer.innerHTML = '';
        assets.forEach((item, index) => {
            assetsContainer.innerHTML += `
                <div class="item-row">
                    <input type="text" class="input-text" placeholder="Asset Name" value="${item.name}" oninput="updateAsset(${index}, 'name', this.value)">
                    <input type="number" class="input-num" min="0" value="${item.value}" oninput="updateAsset(${index}, 'value', this.value)">
                    <button class="btn btn-delete" onclick="removeAsset(${index})">X</button>
                </div>`;
        });

        const liabilitiesContainer = document.getElementById('liabilities-list');
        liabilitiesContainer.innerHTML = '';
        liabilities.forEach((item, index) => {
            liabilitiesContainer.innerHTML += `
                <div class="item-row">
                    <input type="text" class="input-text" placeholder="Debt Name" value="${item.name}" oninput="updateLiability(${index}, 'name', this.value)">
                    <input type="number" class="input-num" min="0" value="${item.value}" oninput="updateLiability(${index}, 'value', this.value)">
                    <button class="btn btn-delete" onclick="removeLiability(${index})">X</button>
                </div>`;
        });

        calculateNetWorth();
    }

    function calculateNetWorth() {
        const currency = document.getElementById('nw-currency').value;
        const sym = currencySymbols[currency] || '$';

        localStorage.setItem(keys.cur, currency);
        localStorage.setItem(keys.assets, JSON.stringify(assets));
        localStorage.setItem(keys.liabilities, JSON.stringify(liabilities));

        let totalAssets = assets.reduce((sum, item) => sum + item.value, 0);
        let totalLiabilities = liabilities.reduce((sum, item) => sum + item.value, 0);
        let netWorth = totalAssets - totalLiabilities;

        document.getElementById('total-assets').innerText = `${sym}${totalAssets.toLocaleString()}`;
        document.getElementById('assets-sum').innerText = `${sym}${totalAssets.toLocaleString()}`;
        document.getElementById('total-liabilities').innerText = `${sym}${totalLiabilities.toLocaleString()}`;
        document.getElementById('liabilities-sum').innerText = `${sym}${totalLiabilities.toLocaleString()}`;
        document.getElementById('true-net-worth').innerText = `${sym}${netWorth.toLocaleString()}`;

        updateChart(sym);
    }

    function updateChart(sym) {
        const ctx = document.getElementById('allocationChart').getContext('2d');
        
        const colors = ['#3b82f6', '#10b981', '#f59e0b', '#8b5cf6', '#ec4899', '#06b6d4', '#64748b'];
        
        const labels = assets.map(a => a.name || 'Unnamed Asset');
        const data = assets.map(a => a.value);

        if(data.every(val => val === 0)) {
            labels.push('No Data');
            data.push(1);
        }

        if (chartInstance) chartInstance.destroy();

        chartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: labels,
                datasets: [{
                    data: data,
                    backgroundColor: colors,
                    borderWidth: 0,
                    hoverOffset: 4
                }]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: {
                    legend: { position: 'bottom', labels: { color: '#f8fafc', font: { family: 'sans-serif' } } },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                let label = context.label || '';
                                if (label !== 'No Data') {
                                    let value = context.parsed;
                                    return ` ${label}: ${sym}${value.toLocaleString()}`;
                                }
                                return ' No data available';
                            }
                        }
                    }
                },
                cutout: '70%'
            }
        });
    }

    window.onload = renderLists;
</script>
</body>
</html>
