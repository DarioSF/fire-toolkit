<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart DCA Rebalancer - FIRE Toolkit</title>
    <style>
        :root {
            --bg-color: #0b1329;
            --card-bg: #1c2541;
            --text-main: #f8fafc;
            --text-muted: #94a3b8;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --border: #334155;
            --table-header: #1e293b;
            --table-hover: #1e293b;
            --success: #34d399;
            --success-bg: #064e3b;
            --danger: #ef4444;
            --danger-bg: #7f1d1d;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 2rem 1rem; line-height: 1.5; }
        .container { max-width: 1000px; margin: 0 auto; }
        
        .nav-back { margin-bottom: 1.5rem; }
        .nav-back a { color: var(--accent); text-decoration: none; font-size: 0.95rem; font-weight: 600; }
        .nav-back a:hover { color: var(--accent-hover); text-decoration: underline; }

        /* HEADER ACTUALIZADO (Sin el botón) */
        header { margin-bottom: 2rem; }
        .header-titles h1 { font-size: 2rem; color: var(--text-main); margin-bottom: 0.25rem; }
        .header-titles p { color: var(--text-muted); }
        
        .btn { padding: 0.5rem 1rem; border-radius: 8px; border: none; font-weight: 600; cursor: pointer; transition: background-color 0.2s; color: white; }
        .btn-primary { background-color: var(--accent); }
        .btn-primary:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: var(--danger); padding: 0.25rem 0.5rem; font-size: 0.875rem; border-radius: 6px; }
        .btn-danger:hover { background-color: #dc2626; }
        
        .config-panel { background: var(--card-bg); padding: 1.5rem; border-radius: 12px; border: 1px solid var(--border); margin-bottom: 1.5rem; display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 1.5rem; }
        .input-group { display: flex; flex-direction: column; gap: 0.5rem; }
        .input-group label { font-size: 0.875rem; font-weight: 600; color: var(--text-muted); }
        .input-group input, .input-group select { padding: 0.75rem; border-radius: 8px; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-main); font-size: 1rem; }
        .input-group input:focus, .input-group select:focus { border-color: var(--accent); outline: none; }
        
        /* NUEVA BARRA DE HERRAMIENTAS (Botón y etiquetas) */
        .table-toolbar { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; margin-bottom: 1rem; }
        .badges-container { display: flex; gap: 0.75rem; flex-wrap: wrap; }
        .status-badge { display: inline-flex; align-items: center; padding: 0.35rem 0.75rem; border-radius: 999px; font-size: 0.875rem; font-weight: bold; }
        .status-ok { background-color: var(--success-bg); color: var(--success); }
        .status-error { background-color: var(--danger-bg); color: var(--danger); border: 1px solid var(--danger); }
        .status-api { background-color: #3b82f633; color: var(--accent); }

        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1rem; margin-bottom: 2rem; }
        .stat-card { background: var(--card-bg); padding: 1.25rem; border-radius: 10px; border: 1px solid var(--border); text-align: center; }
        .stat-card h3 { font-size: 0.875rem; color: var(--text-muted); margin-bottom: 0.25rem; }
        .stat-card p { font-size: 1.5rem; font-weight: bold; color: var(--accent); }
        
        .table-container { background: var(--card-bg); border-radius: 12px; border: 1px solid var(--border); overflow-x: auto; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.925rem; }
        th { background: var(--table-header); padding: 1rem; font-weight: 600; color: var(--text-muted); border-bottom: 1px solid var(--border); }
        td { padding: 1rem; border-bottom: 1px solid var(--border); color: var(--text-main); vertical-align: middle; }
        tr:hover { background: var(--table-hover); }
        
        .currency-combo { display: flex; gap: 0.25rem; align-items: center; }
        .input-table { width: 100%; padding: 0.5rem; border-radius: 6px; border: 1px solid var(--border); background-color: var(--bg-color); color: var(--text-main); }
        .input-text { max-width: 200px; }
        .input-number { max-width: 100px; }
        .select-mini { padding: 0.4rem; border-radius: 6px; border: 1px solid var(--border); background-color: var(--card-bg); color: var(--text-main); font-size: 0.85rem; max-width: 80px; }
        .input-table:focus, .select-mini:focus { border-color: var(--accent); outline: none; }
        
        .badge-allocation { font-weight: bold; color: var(--success); background: var(--success-bg); padding: 0.4rem 0.6rem; border-radius: 6px; display: inline-block;}
    </style>
</head>
<body>

<div class="container">
    <div class="nav-back">
        <a href="../">← Back to FIRE Toolkit</a>
    </div>

    <header>
        <div class="header-titles">
            <h1>Smart DCA Rebalancer</h1>
            <p>Multi-currency support with real-time conversion</p>
        </div>
    </header>

    <div class="config-panel">
        <div class="input-group">
            <label for="base-currency">Base Currency</label>
            <select id="base-currency" onchange="saveAndCalculate()"></select>
        </div>
        <div class="input-group">
            <label for="freq-select">Frequency</label>
            <select id="freq-select" onchange="saveAndCalculate()">
                <option value="Daily">Daily</option>
                <option value="Weekly" selected>Weekly</option>
                <option value="Bi-weekly">Bi-weekly</option>
                <option value="Monthly">Monthly</option>
            </select>
        </div>
        <div class="input-group">
            <label for="period-deposit">Deposit / Period</label>
            <input type="number" id="period-deposit" value="100" min="1" oninput="saveAndCalculate()">
        </div>
        <div class="input-group">
            <label for="pacing-periods">Pacing Horizon</label>
            <input type="number" id="pacing-periods" value="10" min="1" oninput="saveAndCalculate()">
        </div>
    </div>

    <div class="table-toolbar">
        <div class="badges-container">
            <div id="target-warning" class="status-badge status-ok">Total Target: 100%</div>
            <div id="api-status" class="status-badge status-api">Rates: Connecting...</div>
        </div>
        <button class="btn btn-primary" onclick="addAsset()">+ Add Asset</button>
    </div>

    <div class="table-container">
        <table>
            <thead>
                <tr>
                    <th>Asset Name</th>
                    <th>Current Value (Local)</th>
                    <th>Target (%)</th>
                    <th>Ideal Value <span class="base-cur-label"></span></th>
                    <th>Order <span class="base-cur-label"></span></th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="asset-table-body">
                </tbody>
        </table>
    </div>

    <div class="stats-grid">
        <div class="stat-card">
            <h3>Current Portfolio Value</h3>
            <p id="stat-current-value">0.00</p>
        </div>
        <div class="stat-card">
            <h3>Future Value (Post-Pacing)</h3>
            <p id="stat-target-value">0.00</p>
        </div>
        <div class="stat-card">
            <h3>Total Order Amount</h3>
            <p id="stat-total-order">0.00</p>
        </div>
    </div>

    <div id="global-footer-container"></div>
    <script src="../js/footer.js"></script>

</div>

<script>
    const defaultAssets = [
        { name: "Global ETF (e.g. MSCI World)", current: 1000, target: 30, currency: "EUR" },
        { name: "Bonds / Crypto / Satellite", current: 200, target: 19, currency: "EUR" },
        { name: "New Asset", current: 300, target: 51, currency: "USD" }
    ];

    let assets = JSON.parse(localStorage.getItem('fire_dca_assets')) || defaultAssets;
    
    let exchangeRates = { EUR: 1, USD: 1.08, GBP: 0.85, JPY: 160, CHF: 0.98, CAD: 1.47, AUD: 1.64 }; 
    let availableCurrencies = ["EUR", "USD", "GBP", "JPY", "CHF", "CAD", "AUD"];
    
    const commonSymbols = { EUR: '€', USD: '$', GBP: '£', JPY: '¥', CHF: 'CHF', CAD: 'C$', AUD: 'A$', CNY: '¥', INR: '₹', BRL: 'R$', MXN: '$' };

    document.getElementById('period-deposit').value = localStorage.getItem('fire_dca_deposit') || 90;
    document.getElementById('pacing-periods').value = localStorage.getItem('fire_dca_pacing') || 10;
    document.getElementById('freq-select').value = localStorage.getItem('fire_dca_freq') || 'Weekly';

    function getSymbol(cur) {
        return commonSymbols[cur] ? commonSymbols[cur] : cur + ' ';
    }

    function populateBaseCurrencySelect() {
        const baseSelect = document.getElementById('base-currency');
        const savedBase = localStorage.getItem('fire_dca_base_cur') || 'EUR';
        baseSelect.innerHTML = ''; 
        
        availableCurrencies.forEach(c => {
            const opt = document.createElement('option');
            opt.value = c;
            opt.innerText = commonSymbols[c] ? `${c} (${commonSymbols[c]})` : c;
            if (c === savedBase) opt.selected = true;
            baseSelect.appendChild(opt);
        });
    }

    async function fetchRates() {
        try {
            const response = await fetch('https://open.er-api.com/v6/latest/EUR');
            const data = await response.json();
            if (data.rates) {
                exchangeRates = data.rates;
                availableCurrencies = Object.keys(data.rates); 
                
                const majors = ["EUR", "USD", "GBP", "JPY", "CHF", "CAD", "AUD"];
                const others = availableCurrencies.filter(c => !majors.includes(c)).sort();
                availableCurrencies = [...majors, ...others];

                document.getElementById('api-status').innerText = `Rates: Live API (${availableCurrencies.length} currencies)`;
                
                populateBaseCurrencySelect();
                renderTable();
            }
        } catch (error) {
            document.getElementById('api-status').innerText = 'Rates: Offline (Using Defaults)';
            console.error("Failed to fetch rates, using fallbacks.", error);
        }
    }

    function convertCurrency(amount, fromCur, toCur) {
        if (fromCur === toCur) return amount;
        const amountInEur = amount / (exchangeRates[fromCur] || 1);
        return amountInEur * (exchangeRates[toCur] || 1);
    }

    function saveAndCalculate() {
        localStorage.setItem('fire_dca_base_cur', document.getElementById('base-currency').value);
        localStorage.setItem('fire_dca_deposit', document.getElementById('period-deposit').value);
        localStorage.setItem('fire_dca_pacing', document.getElementById('pacing-periods').value);
        localStorage.setItem('fire_dca_freq', document.getElementById('freq-select').value);
        localStorage.setItem('fire_dca_assets', JSON.stringify(assets));
        
        updateCurrencyLabels();
        calculateMath();
    }

    function addAsset() {
        const baseCur = document.getElementById('base-currency').value;
        assets.push({ name: "New Asset", current: 0, target: 0, currency: baseCur });
        saveAndCalculate();
        renderTable();
    }

    function removeAsset(index) {
        assets.splice(index, 1);
        saveAndCalculate();
        renderTable();
    }

    function updateAsset(index, field, value) {
        if(field === 'name' || field === 'currency') {
            assets[index][field] = value;
        } else {
            let parsed = parseFloat(value);
            assets[index][field] = isNaN(parsed) ? 0 : parsed;
        }
        localStorage.setItem('fire_dca_assets', JSON.stringify(assets));
        calculateMath();
    }

    function updateCurrencyLabels() {
        const baseCur = document.getElementById('base-currency').value;
        const sym = getSymbol(baseCur);
        document.querySelectorAll('.base-cur-label').forEach(el => el.innerText = `(${sym})`);
    }

    function calculateMath() {
        const deposit = parseFloat(document.getElementById('period-deposit').value) || 0;
        const pacing = parseInt(document.getElementById('pacing-periods').value) || 1;
        const baseCur = document.getElementById('base-currency').value;
        const sym = getSymbol(baseCur).trim();
        
        let currentTotalBase = 0;
        let targetTotalPct = 0;

        assets.forEach(a => {
            const valInBase = convertCurrency(a.current, a.currency || baseCur, baseCur);
            currentTotalBase += valInBase;
            targetTotalPct += a.target;
        });

        const warningEl = document.getElementById('target-warning');
        if (Math.abs(targetTotalPct - 100) > 0.01) {
            warningEl.className = "status-badge status-error";
            warningEl.innerText = `Warning: Targets sum up to ${targetTotalPct.toFixed(1)}%`;
        } else {
            warningEl.className = "status-badge status-ok";
            warningEl.innerText = `Total Target: 100%`;
        }

        const targetTotalTheoretical = currentTotalBase + (deposit * pacing);
        
        let totalDeficit = 0;
        const rowsData = assets.map(a => {
            const valInBase = convertCurrency(a.current, a.currency || baseCur, baseCur);
            let idealValueBase = targetTotalTheoretical * (a.target / 100);
            let deficit = Math.max(0, idealValueBase - valInBase);
            totalDeficit += deficit;
            return { ...a, idealValueBase, deficit };
        });

        const numAssets = assets.length;
        let actualOrderTotal = 0;
        
        rowsData.forEach((row, index) => {
            if (numAssets === 0) return;
            
            if (deposit < numAssets) {
                row.finalAllocation = deposit / numAssets;
            } else {
                const remainingCash = deposit - numAssets;
                const proportionalShare = totalDeficit === 0 ? 0 : (row.deficit / totalDeficit) * remainingCash;
                row.finalAllocation = 1 + proportionalShare;
            }
            
            actualOrderTotal += row.finalAllocation;
            
            const idealEl = document.getElementById(`ideal-${index}`);
            const orderEl = document.getElementById(`order-${index}`);
            if(idealEl) idealEl.innerText = `${sym} ${row.idealValueBase.toFixed(2)}`;
            if(orderEl) orderEl.innerText = `${sym} ${row.finalAllocation.toFixed(2)}`;
        });

        document.getElementById('stat-current-value').innerText = `${sym} ${currentTotalBase.toFixed(2)}`;
        document.getElementById('stat-target-value').innerText = `${sym} ${targetTotalTheoretical.toFixed(2)}`;
        document.getElementById('stat-total-order').innerText = `${sym} ${actualOrderTotal.toFixed(2)}`;
    }

    function renderTable() {
        const tbody = document.getElementById('asset-table-body');
        tbody.innerHTML = '';
        const baseCur = document.getElementById('base-currency').value;

        assets.forEach((asset, index) => {
            const tr = document.createElement('tr');
            
            let curOptions = '';
            availableCurrencies.forEach(c => {
                const selected = (asset.currency || baseCur) === c ? 'selected' : '';
                curOptions += `<option value="${c}" ${selected}>${c}</option>`;
            });
            
            tr.innerHTML = `
                <td><input type="text" class="input-table input-text" value="${asset.name}" oninput="updateAsset(${index}, 'name', this.value)"></td>
                <td>
                    <div class="currency-combo">
                        <input type="number" class="input-table input-number" value="${asset.current}" step="0.01" min="0" oninput="updateAsset(${index}, 'current', this.value)">
                        <select class="select-mini" onchange="updateAsset(${index}, 'currency', this.value)">
                            ${curOptions}
                        </select>
                    </div>
                </td>
                <td><input type="number" class="input-table input-number" value="${asset.target}" step="0.1" min="0" max="100" oninput="updateAsset(${index}, 'target', this.value)"></td>
                <td id="ideal-${index}">0.00</td>
                <td><span id="order-${index}" class="badge-allocation">0.00</span></td>
                <td><button class="btn btn-danger" onclick="removeAsset(${index})">Delete</button></td>
            `;
            tbody.appendChild(tr);
        });

        updateCurrencyLabels();
        calculateMath();
    }

    window.onload = () => {
        populateBaseCurrencySelect();
        renderTable();
        fetchRates(); 
    };
</script>
</body>
</html>
